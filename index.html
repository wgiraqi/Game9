:root{

  --accent:#7c3aed;

  --success:#22c55e;

}  
  
[data-theme="light"]{

  --panel:#ffffff;  
  --card:#e2e8f0;  
  --card2:#cbd5e1;  
  --text:#0f172a;  
  --muted:#64748b;  
  --line:#cbd5e1;  
  --accent:#4f46e5;

*{  
  box-sizing:border-box;  
  margin:0;  
  padding:0;  
  font-family:Arial,"Tahoma",sans-serif;  
  -webkit-tap-highlight-color:transparent;  
}  
  
html,body{  
  width:100%;  
  height:100%;  
  overflow:hidden;  
}  
  
body{

}  
  
button,input{

}  
  
button{

.app{

  height:100%;  
  display:flex;  
  flex-direction:column;  
}  
  
/* ================= HEADER ================= */  
  
header{  
  height:62px;  
  flex-shrink:0;  
  background:var(--panel);  
  border-bottom:1px solid var(--line);  
  display:flex;  
  align-items:center;  
  gap:8px;  
  padding:8px 12px;  
  z-index:100;  
}  
  
.logo{  
  font-size:18px;  
  font-weight:900;  
  color:var(--gold);  
  white-space:nowrap;  
}  
  
.progressBox{  
  margin-right:auto;  
  display:flex;  
  align-items:center;  
  gap:8px;  
  background:rgba(124,58,237,.12);  
  border:1px solid var(--accent);  
  padding:7px 11px;  
  border-radius:20px;  
  font-size:12px;  
  font-weight:bold;  
}  
  
.progressMini{  
  width:55px;  
  height:6px;  
  background:var(--bg);  
  border-radius:20px;  
  overflow:hidden;  
}  
  
.progressMini i{  
  display:block;  
  height:100%;  
  width:0;  
  background:linear-gradient(90deg,var(--accent),var(--accent2));  
}  
  
.headerBtn{  
  width:40px;  
  height:40px;  
  border-radius:11px;  
  background:var(--card);  
  border:1px solid var(--line);  
  font-size:18px;  
}  
  
.headerBtn:active{  
  transform:scale(.94);  
}  
  
/* ================= PAGES ================= */  
  
.page{  
  display:none;  
  flex:1;  
  min-height:0;  
}  
  
.page.active{  
  display:flex;  
}  
  
/* ================= LAB ================= */  
  
#labPage{  
  flex-direction:column;  
  overflow:hidden;  
}  
  
.labTop{  
  padding:14px;  
  background:  
    radial-gradient(circle at 50% 0%,rgba(124,58,237,.18),transparent 45%),  
    var(--bg);  
  border-bottom:1px solid var(--line);  
}  
  
.labTitle{  
  font-size:22px;  
  font-weight:900;  
}  
  
.labSub{  
  color:var(--muted);  
  font-size:12px;  
  margin-top:5px;  
}  
  
.combineArea{  
  padding:14px;  
  display:flex;  
  flex-direction:column;  
  gap:10px;  
  background:var(--panel);  
  border-bottom:1px solid var(--line);  
}  
  
.slotArea{  
  display:flex;  
  justify-content:center;  
  align-items:center;  
  gap:12px;  
}  
  
.slot{  
  width:105px;  
  height:90px;  
  border:2px dashed var(--line);  
  background:var(--bg);  
  border-radius:18px;  
  display:flex;  
  flex-direction:column;  
  justify-content:center;  
  align-items:center;  
  position:relative;  
}  
  
.slot.filled{  
  border-style:solid;  
  border-color:var(--accent);  
  background:rgba(124,58,237,.1);  
}  
  
.slotIcon{  
  font-size:34px;  
}  
  
.slotName{  
  font-size:11px;  
  font-weight:bold;  
  margin-top:3px;  
  text-align:center;  
}  
  
.slotX{  
  position:absolute;  
  left:-7px;  
  top:-7px;  
  width:21px;  
  height:21px;  
  border-radius:50%;  
  background:var(--danger);  
  color:white;  
  font-size:12px;  
}  
  
.plus{  
  font-size:25px;  
  color:var(--muted);  
}  
  
.combineBtn{  
  height:48px;  
  border-radius:14px;  
  background:linear-gradient(135deg,var(--accent),var(--accent2));  
  color:white;  
  font-weight:900;  
  box-shadow:0 8px 20px rgba(124,58,237,.25);  
}  
  
.combineBtn:active{  
  transform:scale(.98);  
}  
  
.searchBox{  
  padding:10px 12px;  
  background:var(--panel);  
}  
  
.search{  
  width:100%;  
  height:44px;  
  border:1px solid var(--line);  
  background:var(--bg);  
  color:var(--text);  
  border-radius:13px;  
  padding:0 13px;  
  outline:none;  
}  
  
.search:focus{  
  border-color:var(--accent);  
}  
  
.filters{  
  display:flex;  
  gap:7px;  
  overflow-x:auto;  
  padding:0 12px 10px;  
  background:var(--panel);  
  scrollbar-width:none;  
}  
  
.filters::-webkit-scrollbar{  
  display:none;  
}  
  
.filter{  
  flex-shrink:0;  
  padding:8px 12px;  
  border-radius:10px;  
  background:var(--card);  
  color:var(--text);  
  font-size:11px;  
  font-weight:bold;  
}  
  
.filter.active{  
  background:var(--accent);  
  color:#fff;  
}  
  
.inventory{  
  flex:1;  
  min-height:0;  
  overflow:auto;  
  padding:10px 12px 20px;  
  background:var(--panel);  
}  
  
.grid{  
  display:grid;  
  grid-template-columns:repeat(auto-fill,minmax(76px,1fr));  
  gap:8px;  
}  
  
.elementCard{  
  min-height:80px;  
  border:1px solid var(--line);  
  border-radius:13px;  
  background:var(--card);  
  display:flex;  
  flex-direction:column;  
  justify-content:center;  
  align-items:center;  
  gap:4px;  
  transition:.15s;  
}  
  
.elementCard:active{  
  transform:scale(.95);  
}  
  
.elementCard .icon{  
  font-size:27px;  
}  
  
.elementCard .name{  
  font-size:10px;  
  font-weight:bold;  
  text-align:center;  
  padding:0 3px;  
}  
  
.elementCard .cat{  
  font-size:8px;  
  color:var(--muted);  
}  
  
.empty{  
  text-align:center;  
  color:var(--muted);  
  padding:40px 15px;  
}  
  
/* ================= MAP PAGE ================= */  
  
#mapPage{  
  position:relative;  
  flex-direction:column;  
  overflow:hidden;  
  background:var(--bg);  
}  
  
.mapHeader{  
  height:52px;  
  flex-shrink:0;  
  display:flex;  
  align-items:center;  
  gap:7px;  
  padding:6px 9px;  
  background:var(--panel);  
  border-bottom:1px solid var(--line);  
  z-index:30;  
}  
  
.backBtn{  
  height:38px;  
  padding:0 13px;  
  border-radius:10px;  
  background:var(--card);  
  border:1px solid var(--line);  
  font-weight:bold;  
}  
  
.mapTitle{  
  font-weight:900;  
  margin-right:3px;  
}  
  
.mapCounter{  
  margin-right:auto;  
  color:var(--muted);  
  font-size:11px;  
}  
  
.mapOption{  
  width:38px;  
  height:38px;  
  border-radius:10px;  
  background:var(--card);  
  border:1px solid var(--line);  
}  
  
#mapViewport{  
  flex:1;  
  min-height:0;  
  position:relative;  
  overflow:hidden;  
  touch-action:none;  
  background:  
    radial-gradient(circle at center,rgba(124,58,237,.11),transparent 38%),  
    var(--bg);  
}  
  
#world{  
  position:absolute;  
  width:3600px;  
  height:2600px;  
  left:0;  
  top:0;  
  transform-origin:0 0;  
}  
  
#worldSvg{  
  position:absolute;  
  left:0;  
  top:0;  
  width:3600px;  
  height:2600px;  
  pointer-events:none;  
  overflow:visible;  
}  
  
.mapNode{  
  position:absolute;  
  width:116px;  
  min-height:84px;  
  padding:6px;  
  border-radius:16px;  
  background:var(--card);  
  border:1px solid var(--line);  
  box-shadow:var(--shadow);  
  display:flex;  
  flex-direction:column;  
  align-items:center;  
  justify-content:center;  
  gap:2px;  
  z-index:3;  
  transition:.15s;  
}  
  
.mapNode:active{  
  transform:scale(.95);  
}  
  
.mapNode.basic{  
  border-color:var(--gold);  
}  
  
.mapNode.discovered{  
  border-color:var(--accent2);  
  box-shadow:  
    0 0 0 1px rgba(6,182,212,.1),  
    0 8px 22px rgba(0,0,0,.2);  
}  
  
.mapNode.unknown{  
  opacity:.48;  
  filter:grayscale(1);  
}  
  
.mapNode .mapIcon{  
  font-size:28px;  
}  
  
.mapNode .mapName{  
  font-size:11px;  
  font-weight:900;  
  text-align:center;  
}  
  
.mapNode .mapDepth{  
  font-size:8px;  
  color:var(--muted);  
}  
  
.edge{  
  stroke:var(--line);  
  stroke-width:3;  
  opacity:.35;  
}  
  
.edge.known{  
  stroke:var(--accent2);  
  opacity:.75;  
}  
  
.edge.partial{  
  stroke:var(--accent);  
  opacity:.45;  
}  
  
.mapControls{  
  position:absolute;  
  right:10px;  
  top:10px;  
  display:flex;  
  flex-direction:column;  
  gap:7px;  
  z-index:20;  
}  
  
.mapControls button{  
  width:42px;  
  height:42px;  
  border-radius:11px;  
  background:var(--panel);  
  border:1px solid var(--line);  
  font-size:18px;  
  box-shadow:var(--shadow);  
}  
  
.mapLegend{  
  position:absolute;  
  left:10px;  
  top:10px;  
  z-index:20;  
  background:rgba(15,23,42,.75);  
  backdrop-filter:blur(8px);  
  color:white;  
  border:1px solid rgba(255,255,255,.12);  
  padding:9px 11px;  
  border-radius:11px;  
  font-size:10px;  
}  
  
[data-theme="light"] .mapLegend{  
  background:rgba(255,255,255,.82);  
  color:var(--text);  
}  
  
.mapHint{  
  position:absolute;  
  left:50%;  
  bottom:12px;  
  transform:translateX(-50%);  
  z-index:20;  
  background:rgba(15,23,42,.8);  
  color:white;  
  padding:8px 13px;  
  border-radius:20px;  
  font-size:10px;  
  pointer-events:none;  
  white-space:nowrap;  
  transition:.3s;  
}  
  
[data-theme="light"] .mapHint{  
  background:rgba(255,255,255,.85);  
  color:var(--text);  
}  
  
/* ================= AD CONTAINER ================= */  
  
.adContainer{  
  width:100%;  
  flex-shrink:0;  
  background:var(--panel);  
  border-top:1px solid var(--line);  
  display:flex;  
  justify-content:center;  
  align-items:center;  
  padding:4px 0;  
  z-index:100;  
}  
  
/* ================= MODAL ================= */  
  
.modal{  
  position:fixed;  
  inset:0;  
  background:rgba(0,0,0,.72);  
  backdrop-filter:blur(4px);  
  display:none;  
  align-items:center;  
  justify-content:center;  
  z-index:500;  
  padding:15px;  
}  
  
.modal.show{  
  display:flex;  
}  
  
.modalBox{  
  width:min(94%,500px);  
  max-height:88vh;  
  overflow:auto;  
  background:var(--panel);  
  border:1px solid var(--line);  
  border-radius:22px;  
  padding:20px;  
  position:relative;  
  box-shadow:0 25px 70px rgba(0,0,0,.4);  
}  
  
.close{  
  position:absolute;  
  left:12px;  
  top:8px;  
  width:35px;  
  height:35px;  
  background:transparent;  
  color:var(--muted);  
  font-size:28px;  
}  
  
.detailIcon{  
  font-size:65px;  
  text-align:center;  
  margin-top:8px;  
}  
  
.detailName{

  font-size:23px;  
  font-weight:900;  
}  
  
.detailCat{  
  text-align:center;  
  color:var(--muted);  
  font-size:12px;  
  margin-top:5px;  
}  
  
.detailActions{  
  display:flex;  
  gap:7px;  
  margin-top:15px;  
}  
  
.detailAction{  
  flex:1;  
  padding:11px;  
  border-radius:11px;  
  background:var(--card);  
  border:1px solid var(--line);  
  font-size:11px;  
  font-weight:bold;  
}  
  
.recipeBox{  
  margin-top:14px;  
  background:var(--bg);  
  border:1px solid var(--line);  
  border-radius:14px;  
  padding:12px;  
}  
  
.recipeTitle{  
  font-weight:900;  
  font-size:13px;  
  margin-bottom:8px;  
}  
  
.recipe{  
  padding:9px 4px;  
  border-bottom:1px solid var(--line);  
  font-size:11px;  
  text-align:center;  
}  
  
.recipe:last-child{  
  border-bottom:0;  
}  
  
.recipe b{  
  color:var(--accent2);  
}  
  
/* ================= TOAST ================= */  
  
.toast{  
  position:fixed;  
  left:50%;  
  bottom:70px;  
  transform:translate(-50%,20px);  
  background:#111827;  
  color:#fff;  
  padding:10px 17px;  
  border-radius:25px;  
  font-size:12px;  
  font-weight:bold;  
  opacity:0;  
  pointer-events:none;  
  z-index:1000;  
  transition:.25s;  
  box-shadow:0 8px 25px rgba(0,0,0,.3);  
  white-space:nowrap;  
}  
  
.toast.show{  
  opacity:1;  
  transform:translate(-50%,0);  
}  
  
/* ================= DESKTOP ================= */  
  
@media(min-width:800px){  
  
  header{  
    padding-left:20px;  
    padding-right:20px;

  #labPage{  
    max-width:1100px;  
    width:100%;  
    margin:auto;  
    border-left:1px solid var(--line);  
    border-right:1px solid var(--line);  
  }  
  
  .grid{  
    grid-template-columns:repeat(auto-fill,minmax(90px,1fr));  
  }  
  
  .elementCard{  
    min-height:90px;  
  }  
}  
  
/* ================= SMALL MOBILE ================= */  
  
@media(max-width:430px){  
  
  header{  
    height:57px;  
    padding:7px 8px;  
  }  
  
  .logo{  
    font-size:14px;  
  }  
  
  .progressBox{  
    font-size:10px;  
    padding:6px 8px;  
  }  
  
  .progressMini{  
    width:35px;  
  }  
  
  .headerBtn{  
    width:36px;  
    height:36px;  
  }  
  
  .slot{  
    width:91px;  
    height:82px;  
  }  
  
  .slotIcon{  
    font-size:30px;  
  }  
  
  .grid{  
    grid-template-columns:repeat(4,1fr);  
    gap:6px;  
  }  
  
  .elementCard{  
    min-height:73px;  
  }  
  
  .elementCard .icon{  
    font-size:23px;  
  }  
  
  .elementCard .name{  
    font-size:9px;  
  }  
  
  .mapLegend{  
    display:none;  
  }  
  
  .mapNode{  
    width:105px;  
    min-height:78px;  
  }  
}

/* =========================================================  
   VALIDATE RECIPES  
========================================================= */  
  
function normalize(id){  
  return alias[id] || id;  
}  
  
const recipeSet = new Set();  
const RECIPES = [];  
  
rawRecipes.forEach(row=>{  
  
  let a = normalize(row[0]);  
  let b = normalize(row[1]);  
  let r = normalize(row[2]);  
  
  if(!byId[a] || !byId[b] || !byId[r]){  
    return;  
  }  
  
  let sorted = [a,b].sort();  
  let key = sorted[0] + "+" + sorted[1] + "=" + r;  
  
  if(recipeSet.has(key)){  
    return;  
  }  
  
  recipeSet.add(key);  
  
  RECIPES.push({  
    a:sorted[0],  
    b:sorted[1],  
    r  
  });  
  
});  
  
  
/* =========================================================  
   RECIPE LOOKUP  
========================================================= */  
  
const recipeMap = new Map();  
  
RECIPES.forEach(r=>{  
  
  const key = r.a + "+" + r.b;  
  
  if(!recipeMap.has(key)){  
    recipeMap.set(key,r.r);  
  }  
  
});  
  
  
function findRecipe(a,b){  
  
  a = normalize(a);  
  b = normalize(b);  
  
  const [x,y] = [a,b].sort();  
  
  return recipeMap.get(x+"+"+y) || null;  
}

function renderFilters(){  
  
  filters.innerHTML = "";  
  
  categories.forEach(cat=>{

      document.createElement("button");  
  
    btn.className =  
      "filter " +  
      (

/* =========================================================  
   INVENTORY  
========================================================= */  
  
function renderInventory(){  
  
  grid.innerHTML = "";  
  
  const q =  
    search.value.trim().toLowerCase();  
  
  let shown = 0;  
  
  DATA.forEach(row=>{  
  
    const e = byId[row[0]];  
  
    if(!state.discovered.has(e.id)){  
      return;  
    }  
  
    if(  
      state.category !== "الكل" &&  
      e.cat !== state.category  
    ){  
      return;  
    }  
  
    if(  
      q &&  
      !e.name.toLowerCase().includes(q)  
    ){  
      return;  
    }  
  
    shown++;  
  
    const card =  
      document.createElement("button");  
  
    card.className = "elementCard";  
  
    card.innerHTML = `  
      <span class="icon">${e.icon}</span>  
      <span class="name">${e.name}</span>  
      <span class="cat">${e.cat}</span>  
    `;  
  
    card.onclick = ()=>{  
      addToSlots(e.id);  
    };  
  
    card.ondblclick = ()=>{  
      showDetail(e.id);  
    };  
  
    grid.appendChild(card);  
  
  });  
  
  $("empty").style.display =  
    shown ? "none" : "block";  
  
  updateProgress();  
  
}  
  
  
/* =========================================================  
   SLOTS  
========================================================= */  
  
function renderSlots(){  
  
  [slot1,slot2].forEach((slot,index)=>{  
  
    slot.innerHTML = "";  
  
    const id = state.slots[index];  
  
    if(!id){  
  
      slot.className = "slot";  
  
      slot.innerHTML = `  
        <span style="font-size:28px;color:var(--muted)">+</span>  
        <small style="color:var(--muted)">  
          العنصر ${index+1}  
        </small>  
      `;  
  
      return;  
  
    }  
  
    const e = byId[id];  
  
    slot.className = "slot filled";  
  
    slot.innerHTML = `  
      <button class="slotX">×</button>  
      <div class="slotIcon">${e.icon}</div>  
      <div class="slotName">${e.name}</div>  
    `;  
  
    slot.querySelector(".slotX").onclick =  
      ev=>{  
        ev.stopPropagation();  
  
        state.slots.splice(index,1);  
  
        renderSlots();  
      };  
  
  });  
  
}  
  
  
function addToSlots(id){  
  
  if(!state.discovered.has(id)){  
    return;  
  }  
  
  if(state.slots.length >= 2){  
  
    toast("الخانتان ممتلئتان ❗");  
  
    return;  
  }  
  
  state.slots.push(id);  
  
  renderSlots();  
  
  if(state.slots.length === 2){  
  
    setTimeout(()=>{  
      $("combineBtn").focus();  
    },50);  
  
  }  
  
}  
  
  
/* =========================================================  
   COMBINE  
========================================================= */  
  
$("combineBtn").onclick = ()=>{  
  
  if(state.slots.length < 2){  
  
    toast("اختر عنصرين أولاً ✨");  
  
    return;  
  }  
  
  const a = state.slots[0];  
  const b = state.slots[1];  
  
  const result = findRecipe(a,b);  
  
  state.slots = [];  
  
  renderSlots();  
  
  if(!result){  
  
    toast("لا توجد وصفة لهذا الدمج ❌");  
  
    return;  
  }  
  
  const element = byId[result];  
  
  const isNew =  
    !state.discovered.has(result);  
  
  state.discovered.add(result);  
  
  save();  
  
  renderInventory();  
  
  renderMap();  
  
  updateProgress();  
  
  if(isNew){  
  
    showDetail(result,true);  
  
  }else{  
  
    toast(  
      "تم الدمج: "+  
      element.icon+  
      " "+  
      element.name  
    );  
  
  }  
  
};

/* =========================================================

========================================================= */  
  
function calculateDepths(){  
  
  const depth = {  
  
    fire:0,  
    water:0,  
    earth:0,  
    air:0  
  
  };  
  
  let changed = true;  
  let guard = 0;  
  
  while(changed && guard < 100){  
  
    changed = false;  
    guard++;  
  
    RECIPES.forEach(r=>{  
  
      if(  
        depth[r.a] !== undefined &&  
        depth[r.b] !== undefined  
      ){  
  
        const nd =  
          Math.max(  
            depth[r.a],  
            depth[r.b]  
          ) + 1;  
  
        if(  
          depth[r.r] === undefined ||  
          nd < depth[r.r]  
        ){  
  
          depth[r.r] = nd;  
          changed = true;  
  
        }  
  
      }  
  
    });  
  
  }  
  
  return depth;  
  
}  
  
  
const DEPTH = calculateDepths();  
  
  
/* =========================================================  
   BUILD MAP POSITIONS  
========================================================= */  
  
function buildPositions(){  
  
  const positions = {};  
  const buckets = {};  
  
  DATA.forEach(row=>{  
  
    const id = row[0];  
    let depth = DEPTH[id];  
  
    if(depth === undefined){  
      depth = 9;  
    }  
  
    if(!buckets[depth]){  
      buckets[depth] = [];  
    }  
  
    buckets[depth].push(id);  
  
  });  
  
  
  Object.keys(buckets)  
    .sort((a,b)=>Number(a)-Number(b))  
    .forEach(depthKey=>{  
  
      const list = buckets[depthKey];  
      const depth = Number(depthKey);  
      const columns = 5;  
  
      list.forEach((id,index)=>{  
  
        const col = index % columns;  
        const row = Math.floor(index / columns);  
        const wave = (row % 2) * 55;  
  
        positions[id] = {  
          x: 100 + depth * 260,  
          y: 100 + row * 150 + wave + col * 15  
        };  
  
      });  
  
    });  
  
  positions.fire = { x:80, y:500 };  
  positions.water = { x:80, y:650 };  
  positions.earth = { x:80, y:800 };  
  positions.air = { x:80, y:950 };  
  
  return positions;  
  
}  
  
  
const POSITIONS = buildPositions();  
  
  
/* =========================================================  
   CREATE MAP NODE & RENDER MAP  
========================================================= */  
  
function createMapNode(e){  
  
  const node = document.createElement("button");  
  const discovered = state.discovered.has(e.id);  
  
  node.className =  
    "mapNode " +  
    (discovered ? "discovered " : "unknown ") +  
    (e.index < 4 ? "basic" : "");  
  
  const p = POSITIONS[e.id] || { x:1500, y:1000 };  
  
  node.style.left = p.x + "px";  
  node.style.top = p.y + "px";  
  node.dataset.id = e.id;  
  
  node.innerHTML = `  
    <span class="mapIcon">${discovered ? e.icon : "❓"}</span>  
    <span class="mapName">${discovered ? e.name : "？？؟"}</span>  
    <span class="mapDepth">${e.cat}</span>  
  `;  
  
  node.onclick = ev => {  
    ev.stopPropagation();  
    if(discovered){  
      showDetail(e.id);  
    }else{  
      toast("هذا العنصر غير مكتشف بعد 🔒");  
    }  
  };  
  
  return node;  
}  
  
function updateWorldTransform(){  
  world.style.transform = `translate(${mapX}px, ${mapY}px) scale(${mapScale})`;  
}  
  
function renderMap(){  
  world.querySelectorAll(".mapNode").forEach(n => n.remove());  
  svg.innerHTML = "";  
  
  DATA.forEach(row => {  
    const e = byId[row[0]];  
    if(state.mapMode === "discovered" && !state.discovered.has(e.id)) return;  
    world.appendChild(createMapNode(e));  
  });  
  
  RECIPES.forEach(r => {  
    const aDiscovered = state.discovered.has(r.a);  
    const bDiscovered = state.discovered.has(r.b);  
    const rDiscovered = state.discovered.has(r.r);  
  
    if(state.mapMode === "discovered" && !rDiscovered) return;  
  
    const posA = POSITIONS[r.a];  
    const posB = POSITIONS[r.b];  
    const posR = POSITIONS[r.r];  
  
    if(!posA || !posB || !posR) return;  
  
    const drawLine = (from, to, isKnown) => {  
      const line = document.createElementNS("http://www.w3.org/2000/svg", "line");  
      line.setAttribute("x1", from.x + 58);  
      line.setAttribute("y1", from.y + 42);  
      line.setAttribute("x2", to.x + 58);  
      line.setAttribute("y2", to.y + 42);  
      line.setAttribute("class", "edge " + (isKnown ? "known" : "partial"));  
      svg.appendChild(line);  
    };  
  
    if(aDiscovered && rDiscovered) drawLine(posA, posR, true);  
    if(bDiscovered && rDiscovered) drawLine(posB, posR, true);  
  });  
  
  updateWorldTransform();  
}  
  
function centerMap(){  
  const rect = viewport.getBoundingClientRect();  
  mapScale = 0.55;  
  mapX = (rect.width / 2) - (1800 * mapScale);  
  mapY = (rect.height / 2) - (1300 * mapScale);  
  updateWorldTransform();  
}  
  
function focusNode(id){  
  const p = POSITIONS[id];  
  if(!p) return;  
  const rect = viewport.getBoundingClientRect();  
  mapScale = 0.85;  
  mapX = (rect.width / 2) - ((p.x + 58) * mapScale);  
  mapY = (rect.height / 2) - ((p.y + 42) * mapScale);  
  updateWorldTransform();  
}  
  
/* =========================================================  
   MAP CONTROLS & INTERACTION  
========================================================= */  
  
$("zoomIn").onclick = () => { mapScale = Math.min(mapScale + 0.15, 1.8); updateWorldTransform(); };  
$("zoomOut").onclick = () => { mapScale = Math.max(mapScale - 0.15, 0.25); updateWorldTransform(); };  
$("centerMap").onclick = centerMap;  
$("zoomReset").onclick = () => { mapScale = 1; updateWorldTransform(); };  
  
$("showDiscovered").onclick = () => {  
  state.mapMode = state.mapMode === "all" ? "discovered" : "all";  
  $("showDiscovered").style.background = state.mapMode === "discovered" ? "var(--accent)" : "var(--card)";  
  renderMap();  
  toast(state.mapMode === "discovered" ? "إظهار المكتشفات فقط 👁️" : "إظهار الكل 🌐");  
};  
  
viewport.addEventListener("pointerdown", e => {  
  if(e.target.closest("button")) return;  
  dragging = true;  
  dragStartX = e.clientX;  
  dragStartY = e.clientY;  
  originalX = mapX;  
  originalY = mapY;  
  viewport.setPointerCapture(e.pointerId);  
});  
  
viewport.addEventListener("pointermove", e => {  
  if(!dragging) return;  
  mapX = originalX + (e.clientX - dragStartX);  
  mapY = originalY + (e.clientY - dragStartY);  
  updateWorldTransform();  
});  
  
const endDrag = e => {  
  if(dragging){  
    dragging = false;  
    try{ viewport.releasePointerCapture(e.pointerId); }catch(err){}  
  }  
};  
viewport.addEventListener("pointerup", endDrag);  
viewport.addEventListener("pointercancel", endDrag);  
  
viewport.addEventListener("wheel", e => {  
  e.preventDefault();  
  const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;  
  mapScale = Math.min(Math.max(mapScale * zoomFactor, 0.25), 1.8);  
  updateWorldTransform();  
}, { passive: false });  
  
/* =========================================================  
   INIT APP  
========================================================= */  
  
renderFilters();  
renderInventory();  
renderSlots();  
updateProgress();  
  
</script>  
</body>  
</html>
